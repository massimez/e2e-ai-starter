name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      INTERNAL_API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
      NEXT_PUBLIC_STORAGE_ORIGIN: ""
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies for high/critical vulnerabilities
        run: bun audit --audit-level=high

      - name: Run Ultracite / Biome checks
        run: bun run check

      - name: Run TypeScript typechecks
        run: bun run check-types

      - name: Typecheck setup scripts
        run: ./apps/api/node_modules/.bin/tsc --noEmit -p scripts/tsconfig.json

      - name: Run automated tests
        run: bun run test

      - name: Build all workspaces
        run: bun run build

  migrate:
    name: Verify Drizzle Migrations (pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: app_ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/app_ci
      DATABASE_SSL: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        run: bun run db:migrate

      - name: Test wallet transactions against PostgreSQL
        run: WALLET_TEST_DATABASE_URL="$DATABASE_URL" bun run test apps/api/src/modules/wallet/wallet.test.ts
